# =======================================================================
# 1. PENAMAAN SKENARIO DINAMIS
# =======================================================================
# Menggabungkan nama Router dan Seed agar setiap dari 3 run memiliki 
# nama skenario (dan nama file report) yang unik[cite: 1, 2].
Scenario.name = PeopleRank_Seed%%MovementModel.rngSeed%%

# =======================================================================
# 2. PENGATURAN ROUTER (KHUSUS PEOPLERANK)
# =======================================================================
# Hanya menggunakan 1 jenis DecisionEngineRouter, menghapus konfigurasi batch sebelumnya[cite: 2, 3].
Group.router = DecisionEngineRouter
DecisionEngineRouter.decisionEngine = PeopleRankDecisionEngine

# Parameter tambahan dari PeopleRankDecisionEngine.java
DecisionEngineRouter.dampingFactor = 0.85

# Kita gunakan 3 variasi Seed untuk Movement (Pergerakan Node) 
MovementModel.rngSeed = [1234; 5678; 9012]

# (Trik Master): Agar seed pembuatan pesan/router juga ikut berubah dan 
# selaras dengan seed pergerakan, kita "copy" nilainya menggunakan macro[cite: 5].
MessageRouter.rngSeed = %%MovementModel.rngSeed%%

# =======================================================================
# 3. PENGATURAN GRUP (PEMBAGIAN NODE)
# =======================================================================
Scenario.nrofHostGroups = 2

# ----- GRUP 1 -----
Group1.groupID = G1
Group1.nrofHosts = 50

# ----- GRUP 2 -----
Group2.groupID = G2
Group2.nrofHosts = 150

# =======================================================================
# 4. PENGATURAN REPORT
# =======================================================================
Report.reportDir = reports/
Report.nrofReports = 3
Report.warmup = 10000
Report.report1 = MessageStatsReport
Report.report2 = DroppedPerNodePerIntervalReport
Report.report3 = DistanceDelayReport

# =======================================================================
# 5. PENGATURAN LAINNYA
# =======================================================================
Scenario.simulateConnections = true
Scenario.updateInterval = 0.1
Scenario.endTime = 43200

Group.movementModel = MapBasedMovement
