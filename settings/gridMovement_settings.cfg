#===========================================================================
# 1. SCENARIO CONFIGURATION
#===========================================================================
Scenario.name = Prophet_Community_Model
Scenario.simulateConnections = true
Scenario.updateInterval = 0.1
Scenario.endTime = 43200

# PERBAIKAN: Ubah menjadi 2 karena baru 2 grup yang didefinisikan di bawah
Scenario.nrofHostGroups = 2

#===========================================================================
# 2. INTERFACE SETTINGS
#===========================================================================
# PERBAIKAN: Tambahkan '#' agar tidak dibaca sebagai sintaks yang salah
# [ Bluetooth interface ]
btInterface.type = SimpleBroadcastInterface
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 10

#===========================================================================
# 3. COMMON GROUP SETTINGS
#===========================================================================
# [ Common settings (for all groups) ]
Group.router = ProphetRouter
Group.bufferSize = 5M
Group.nrofInterfaces = 1
Group.interface1 = btInterface
Group.msgTtl = 300

Group.speed = 0.5, 0.5
Group.waitTime = 0, 120

#===========================================================================
# 4. RANDOM GRID MOVEMENT SETTINGS
#===========================================================================
# PENGATURAN GLOBAL GRID (Namespace Kustom)
RandomGridMovement.gridCountX = 5
RandomGridMovement.gridCountY = 5

# PENGATURAN UMUM GRUP
Group.movementModel = RandomGridMovement

# GRUP 1
Group1.groupID = A
Group1.nrofHosts = 30
Group1.homeX = 0
Group1.homeY = 0

# GRUP 2
Group2.groupID = B
Group2.nrofHosts = 30
Group2.homeX = 4
Group2.homeY = 4

#===========================================================================
# 5. MOVEMENT & WORLD SETTINGS
#===========================================================================
# [ Movement model settings ]
MovementModel.rngSeed = 1
MovementModel.worldSize = 3000, 1500
MovementModel.warmup = 1000

#===========================================================================
# 6. EVENTS SETTINGS
#===========================================================================
# [ Events ]
Events.nrof = 1

Events1.class = MessageEventGenerator
Events1.interval = 25,35
Events1.size = 500k,1M
# PERBAIKAN: Diubah ke 0,59 agar mencakup seluruh 60 node (30 dari Grup1, 30 dari Grup2)
Events1.hosts = 0,59
Events1.prefix = M

#===========================================================================
# 7. REPORT SETTINGS
#===========================================================================
# [ Reports ]
# PERBAIKAN: Diubah menjadi 1 karena hanya ada 1 report yang dideklarasikan
Report.nrofReports = 1
Report.warmup = 0
Report.reportDir = reports/CommunityProphet/

Report.report1 = MessageStatsReport