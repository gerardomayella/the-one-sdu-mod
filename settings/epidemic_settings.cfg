# =========================================================
# Skenario Simulasi Epidemic Router dengan Sistem Vaccine
# =========================================================

Scenario.name = Epidemic_Vaccine_Scenario
Scenario.simulateConnections = true
Scenario.updateInterval = 0.1
# Simulasi berjalan selama 12 jam (43200 detik)
Scenario.endTime = 43200

# =========================================================
# Pengaturan Interface (Bluetooth)
# =========================================================
btInterface.type = SimpleBroadcastInterface
# Kecepatan transmisi 250kBps dan jangkauan 10 meter
btInterface.transmitSpeed = 250k
btInterface.transmitRange = 10

# =========================================================
# Pengaturan Grup Node (Host)
# =========================================================
# Hanya menggunakan 1 grup node untuk penyederhanaan
Scenario.nrofHostGroups = 1

Group.groupID = p
# Menggunakan EpidemicRouter yang telah Anda modifikasi
Group.router = EpidemicRouter
# Menggunakan RandomWaypoint sebagai model pergerakan
Group.movementModel = RandomWaypoint

# Kapasitas buffer diatur ke 5MB agar efek "pembersihan" oleh vaksin bisa terlihat jelas
Group.bufferSize = 5M
Group.waitTime = 0, 120
Group.speed = 0.5, 1.5

# Time-To-Live (TTL) pesan adalah 300 menit
Group.msgTtl = 300
# Jumlah node yang berpartisipasi dalam jaringan
Group.nrofHosts = 40

Group.nrofInterfaces = 1
Group.interface1 = btInterface

# =========================================================
# Pengaturan Pembuatan Pesan (Event Generator)
# =========================================================
Events.nrof = 1
Events1.class = MessageEventGenerator
# Pesan baru dibuat setiap 25 hingga 35 detik
Events1.interval = 25,35
# Ukuran pesan diatur antara 500kB hingga 1MB (relatif besar agar membebani buffer)
Events1.size = 500k,1M
# Rentang alamat sumber dan tujuan (0 sampai 39, sesuai nrofHosts)
Events1.hosts = 0,39
Events1.prefix = M

# =========================================================
# Pengaturan Model Pergerakan dan Peta
# =========================================================
MovementModel.rngSeed = 1
MovementModel.worldSize = 4500, 3400
MovementModel.warmup = 1000

# =========================================================
# Pengaturan Laporan (Reports)
# =========================================================
Report.nrofReports = 2
Report.warmup = 0
Report.reportDir = reports/Epidemic_Output/
# Laporan statistik utama (Delivery Probability, Overhead, Latency, dll)
Report.report1 = MessageStatsReport
# Laporan daftar event untuk melihat aktivitas pesan secara detail
Report.report2 = EventLogReport

# =========================================================
# Pengaturan Optimasi & GUI
# =========================================================
Optimization.cellSizeMult = 5
Optimization.randomizeUpdateOrder = true
GUI.EventLogPanel.nrofEvents = 100