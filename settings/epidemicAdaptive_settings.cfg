# =========================================================
# PENGATURAN ROUTER DAN BUFFER
# =========================================================
Scenario.name = epidemic_adaptive_mofo_5M

# 1. Tentukan router yang baru Anda buat untuk grup node
Group.router = EpidemicAdaptiveRouter

# 2. Atur metode pelepasan buffer (Drop Policy)
# Pilihan yang tersedia pada Enum Anda: FIFO, SHLI, MOFO, LHLI
AdaptiveBufferRouter.bufferReleaseMethod = mofo

# 3. Pengaturan standar lainnya (sesuaikan dengan kebutuhan Anda)
Group.bufferSize = 5M
Group.msgTtl = 300

# =========================================================
# PENGATURAN PERGERAKAN (TANPA PETA / RANDOM WAYPOINT)
# =========================================================
# Mengatur model pergerakan menjadi Random Waypoint
Group.movementModel = RandomWaypoint

# Menentukan ukuran dunia/area simulasi (wajib ada jika tanpa peta)
# Format: lebar, tinggi (dalam satuan meter). Contoh di bawah: 4500m x 3400m
MovementModel.worldSize = 4500, 3400